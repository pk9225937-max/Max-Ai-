name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== java -version ==="
          java -version

          echo "=== JAVA_HOME ==="
          echo "JAVA_HOME: $JAVA_HOME"

          JAVA_VER_LINE=$(java -version 2>&1 | head -n 1)
          JAVA_MAJOR=$(echo "$JAVA_VER_LINE" | sed -nE 's/.*version "([0-9]+).*/\1/p')

          if [ -z "$JAVA_MAJOR" ]; then
            JAVA_MAJOR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print ($1 == "1" ? $2 : $1)}')
          fi

          echo "Detected Java major version: '$JAVA_MAJOR'"

          if [ -z "$JAVA_MAJOR" ]; then
            echo "::error::Unable to detect active Java major version."
            exit 1
          fi

          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "::error::Detected Java version $JAVA_MAJOR is lower than required version 17."
            exit 1
          fi

          echo "Java environment verified: Java $JAVA_MAJOR (>= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "Generating temporary debug.keystore..."
            "$JAVA_HOME/bin/keytool" -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "::error::./debug.keystore does not exist after generation attempt."
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK not found at $EXPECTED_APK"
            echo "Searching only inside app/build/outputs/apk for discovered APKs..."
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::$EXPECTED_APK is not a regular file."
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::$EXPECTED_APK is empty."
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "::error::$EXPECTED_APK does not have .apk extension."
              exit 1
              ;;
          esac

          if [ "$EXPECTED_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "::error::APK is not exactly app/build/outputs/apk/debug/app-debug.apk"
            exit 1
          fi

          echo "Successfully verified debug APK: $EXPECTED_APK"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          REPO_RAW="${GITHUB_REPOSITORY#*/}"
          REPO_SAFE=$(echo "$REPO_RAW" | tr -c 'a-zA-Z0-9._-' '-' | sed 's/^-*//;s/-*$//')
          if [ -z "$REPO_SAFE" ]; then
            REPO_SAFE="app"
          fi
          ASSET_FILENAME="${REPO_SAFE}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_DIR=$(mktemp -d -p "$RUNNER_TEMP" release_asset_XXXXXX)
          ASSET_PATH="${ASSET_DIR}/${ASSET_FILENAME}"

          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET_PATH"

          if [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Failed to copy release asset or asset is empty."
            exit 1
          fi

          echo "Prepared release asset: $ASSET_PATH"
          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== GitHub CLI Version ==="
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Release asset $ASSET_PATH does not exist or is empty."
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "::error::Release asset $ASSET_PATH does not have .apk extension."
              exit 1
              ;;
          esac

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          RELEASE_NOTES=$(cat <<EOF
          ### Android Debug APK Build

          This is an automatically generated debug APK.
          - **Built by**: GitHub Actions
          - **Run Number**: ${GITHUB_RUN_NUMBER}
          - **Run Attempt**: ${GITHUB_RUN_ATTEMPT}
          - **Source Commit SHA**: ${GITHUB_SHA}

          > **Note**:
          > - This APK is intended for testing and development.
          > - This APK is not a Play Store production release.
          > - This APK is signed only with a temporary debug keystore.
          EOF
          )

          echo "Creating GitHub Release with tag: $RELEASE_TAG"
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          ARTIFACT_OUTCOME="${{ steps.upload_artifact.outcome }}"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "GitHub Release publishing succeeded."
            gh release view "$RELEASE_TAG"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${GITHUB_RUN_NUMBER}"
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url)
            echo "Release Page URL: $RELEASE_URL"
            echo "Release Asset Filename: $ASSET_NAME"

            {
              echo "## Build & Release Summary"
              echo ""
              echo "### GitHub Release Published Successfully"
              echo "- **Release Tag**: \`$RELEASE_TAG\`"
              echo "- **Release Title**: Debug APK Build #${GITHUB_RUN_NUMBER}"
              echo "- **Release Page URL**: $RELEASE_URL"
              echo "- **Release Asset**: \`$ASSET_NAME\`"
              echo ""
              echo "The debug APK can be downloaded directly from the **Assets** section of the [GitHub Release]($RELEASE_URL) on your mobile device."
              echo ""
              echo "- **Backup Artifact**: The standard GitHub Actions artifact named \`app-debug-apk\` is also preserved and available in this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing was not successful or was skipped."
            if [ "$ARTIFACT_OUTCOME" = "success" ]; then
              echo "The APK build succeeded and the Actions artifact named 'app-debug-apk' remains available."
              {
                echo "## Build & Release Summary"
                echo ""
                echo "### Warning: GitHub Release Publishing Failed"
                echo "> GitHub Release publishing encountered an error, but the APK was successfully built and verified."
                echo ""
                echo "### Backup Artifact Available"
                echo "- The debug APK is preserved as a normal GitHub Actions artifact named \`app-debug-apk\`."
                echo "- You can download \`app-debug-apk\` from the Artifacts section of this workflow run."
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "The APK build or artifact upload did not complete."
            fi
          fi
